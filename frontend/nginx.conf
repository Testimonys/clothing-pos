# ============================================================
# Nginx — 华兴鞋服城（Docker 环境）
# 域名: luohuai2026.cn（复用服务器上既有 Let's Encrypt 证书）
# 证书: /etc/letsencrypt（宿主机挂载进容器），certbot webroot 续期
# ============================================================

# gzip 压缩
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

# HTTP → HTTPS 强制跳转
server {
    listen 80;
    server_name luohuai2026.cn;

    # certbot ACME challenge 目录（用于证书自动续期）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 服务
server {
    listen 443 ssl http2;
    server_name luohuai2026.cn;

    # SSL 证书（宿主机 /etc/letsencrypt 挂载进容器）
    ssl_certificate     /etc/letsencrypt/live/luohuai2026.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/luohuai2026.cn/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # luohuai codeX  modify: allow multipart overhead for the backend's 10MB file limit.
    client_max_body_size 12m;

    root /usr/share/nginx/html;
    index index.html;

    # SPA history mode fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源 — 长缓存（Vite 构建时文件名带 hash）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API proxy to backend
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置（备份接口可能较慢）
        proxy_read_timeout 60s;
    }

    # Uploaded images proxy
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;

        # 上传的图片缓存 1 天
        expires 1d;
        add_header Cache-Control "public";
    }

    # 安全头部
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
